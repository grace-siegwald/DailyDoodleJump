name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the current deploy instead of cutting it off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish Blazor app
        run: dotnet publish src/DailyDoodle.Web/DailyDoodle.Web.csproj --configuration Release --output publish

      - name: Prepare for GitHub Pages
        env:
          # "/DailyDoodleJump" for a project site, "" for a custom domain or user site
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          INDEX=publish/wwwroot/index.html

          # Blazor loads every asset relative to <base href>, and on Pages the site lives under /<repo>/.
          sed -i -E "s|<base href=\"[^\"]*\" */?>|<base href=\"${BASE_PATH}/\" />|" "$INDEX"
          grep -q "<base href=\"${BASE_PATH}/\"" "$INDEX" || { echo "::error::base href was not updated"; exit 1; }

          # Pages serves 404.html for unknown paths; letting it boot the app makes deep links work.
          cp "$INDEX" publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
